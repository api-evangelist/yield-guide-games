name: Yield Guild Games
description: >-
  Yield Guild Games (YGG) is a decentralized autonomous organization (DAO) and
  one of the world's first and largest web3 gaming guilds, founded in 2020 by
  Gabby Dizon, Beryl Li, and the pseudonymous "Owl of Moistness" out of the
  Philippines. YGG invests in NFTs and blockchain-game assets, lends them to
  players, and shares the resulting yield with its community and YGG token
  holders. Its onchain Guild Protocol (launched on Base) equips guilds with a
  modular library of smart-contract tooling for treasury wallets, programmable
  quests, and contribution tracking, while YGG Play acts as a publisher for
  casual crypto games. The company was backed by Andreessen Horowitz (a16z),
  which led a $4.6M round in 2021. Note: this repository slug "yield-guide-games"
  preserves an upstream typo of the real company name, Yield Guild Games.
